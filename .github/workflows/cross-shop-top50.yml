name: Publish cross-shop escort Top50
on:
  push:
    branches: [master]
    paths:
      - 'delta-top50/build.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: delta-top50-publish
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Build static reference page
        run: python3 delta-top50/build.py
      - name: Commit generated files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delta-top50/index.html delta-top50/top50.csv delta-top50/audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish sourced cross-shop Top50 conditional comparison'
          git pull --rebase origin master
          git push origin HEAD:master
