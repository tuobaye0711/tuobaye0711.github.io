name: Build Delta escort reference site
on:
  push:
    branches: [master]
    paths:
      - 'delta-escort/build.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: delta-escort-reference-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser used to read the public merchant catalog
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Archive original posters, build and verify static pages
        run: python3 delta-escort/build.py
      - name: Commit only Delta escort generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delta-escort/index.html delta-escort/posters delta-escort/build-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Delta ranking rendering; include complete rules and original posters'
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Save browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-escort-browser-verification
          path: /tmp/escort-verified-*.png
          if-no-files-found: ignore
