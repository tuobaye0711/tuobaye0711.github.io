name: Build Delta escort reference site
on:
  push:
    branches: [master]
    paths:
      - 'delta-escort/build.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: delta-escort-reference-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Archive merchant posters and build readable static pages
        run: python3 delta-escort/build.py
      - name: Commit only Delta escort generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delta-escort/index.html delta-escort/posters delta-escort/build-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Build Delta escort rules reference with 40 archived source posters'
          git pull --rebase origin master
          git push origin HEAD:master
