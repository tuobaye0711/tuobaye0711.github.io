name: Build Delta escort reference site
on:
  push:
    branches: [master]
    paths:
      - 'delta-escort/build.py'
      - 'delta-escort/build-v3.py'
      - 'delta-escort/ranking-v3.json'
      - 'delta-escort/rules.json'
      - 'delta-escort/apply-corrections.py'
      - '.github/workflows/delta-escort-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: delta-escort-reference-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Apply scoped reader corrections
        run: python3 delta-escort/apply-corrections.py
      - name: Install browser for static page verification
        run: |
          python3 -m pip install playwright
          python3 -m playwright install --with-deps chromium
      - name: Build calibrated rankings and preserve archived source posters
        env:
          ESCORT_USE_ARCHIVED: '1'
        run: |
          python3 delta-escort/build-v3.py
          python3 delta-escort/apply-corrections.py --check-page
      - name: Commit only Delta escort content and generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add delta-escort/rules.json delta-escort/ranking-v3.json delta-escort/data.js delta-escort/index.html delta-escort/build-report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Correct Little Giant initial HP: Part 1 12, Part 2 30; withdraw stale analysis'
          git pull --rebase origin master
          git push origin HEAD:master
      - name: Save browser verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delta-escort-browser-verification
          path: /tmp/escort-verified-*.png
          if-no-files-found: ignore
