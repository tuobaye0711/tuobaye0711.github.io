name: Escort actual product rule sheets
on:
  push:
    branches: ['research/escort-market-20260928']
    paths: ['.github/workflows/escort-market-rich-rules.yml']
permissions:
  contents: write
  actions: read
jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: escort-market-public-sources-20260928
          run-id: 36373785394
          github-token: ${{ github.token }}
          path: /tmp/market
      - uses: actions/download-artifact@v4
        with:
          name: escort-market-supplement-20260928
          run-id: 36373937785
          github-token: ${{ github.token }}
          path: /tmp/supp
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-chi-sim
          pip install pillow beautifulsoup4 requests
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          from PIL import Image
          import json,requests,hashlib,io
          O=Path('escort-market-audit/rich-rules');O.mkdir(parents=True,exist_ok=True);seen={};rows=[]
          for root in [Path('/tmp/market'),Path('/tmp/supp')]:
            m=json.loads((root/'manifest.json').read_text());imgs={x['url']:x for x in m['images']if 'file'in x}
            for p in m['pages']:
              if '/pricing/product/'not in p['url']or not p.get('html_file',p.get('key')):continue
              hpath=root/'pages'/(p['key']+'.html')
              if not hpath.exists():continue
              h=hpath.read_text();s=BeautifulSoup(h,'html.parser');title=p.get('title','');name=p['shop']
              wanted=(name=='血族'and any(v in title for v in ['188 保688','388 保1588','688保3000','1588W 10血','3588W 20血','单局3个金杯','沙保','188保988','488保2388','红卡','翻翻乐','2588W','5888W','浓缩铀','反应堆','火箭燃料','浮力','卫星锅']))or(name=='4AM页面店'and any(v in title for v in ['小小巨人','千万','小金','不吃枪','黑洞','沙色','沙保','金弹']))or(name=='大饼'and any(v in title for v in ['拯救AWM','绝密环游记','七宗罪','摸红单','消消乐','趣味游园会']))
              if not wanted:continue
              urls=[e.get('src')for e in s.select('img[data-oss-id]')if e.get('src','').startswith('https://')]
              for u in urls:
                if u not in seen:
                  try:
                    if u in imgs:blob=(root/imgs[u]['file']).read_bytes()
                    else:
                      z=requests.get(u,headers={'User-Agent':'Mozilla/5.0','Referer':p['url']},timeout=20);z.raise_for_status();blob=z.content
                    im=Image.open(io.BytesIO(blob)).convert('RGB')
                    if im.width<300 or im.height<150:continue
                    if im.width<1100:im=im.resize((im.width*2,im.height*2))
                    key=len(seen);path=Path('/tmp')/f'rule-actual-{key:02d}.png';im.save(path);seen[u]={'index':key,'path':str(path),'image_url':u,'sha256':hashlib.sha256(blob).hexdigest(),'sources':[]}
                  except Exception:continue
                if u in seen:seen[u]['sources'].append({'shop':name,'url':p['url'],'title':title})
          selected=list(seen.values())[:45]
          Path('/tmp/actual-ocr-list.txt').write_text('\n'.join(x['path']for x in selected));(O/'index.json').write_text(json.dumps(selected,ensure_ascii=False,indent=2));print('ACTUAL RULE SHEETS',len(selected))
          PY
          OMP_THREAD_LIMIT=1 tesseract /tmp/actual-ocr-list.txt /tmp/actual-rules -l chi_sim+eng --psm 11
          python - <<'PY'
          from pathlib import Path
          import json
          O=Path('escort-market-audit/rich-rules');rows=json.loads((O/'index.json').read_text());texts=Path('/tmp/actual-rules.txt').read_text().split('\f')
          for i,r in enumerate(rows):r['transcription']=texts[i]if i<len(texts)else'';(O/f'{i:02d}.txt').write_text(json.dumps(r,ensure_ascii=False,indent=2))
          (O/'all.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print('\n'.join(str(r['index'])+' '+str([s['title']for s in r['sources']])+' '+r['transcription'][:70]for r in rows))
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add escort-market-audit/rich-rules
          git commit -m 'Record product-specific rule image transcriptions, separately flagged from page text'
          git pull --rebase origin research/escort-market-20260928
          git push origin HEAD:research/escort-market-20260928
