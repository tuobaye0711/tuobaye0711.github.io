<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<title>三角洲护航性价比榜</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--panel2:#18212c;--line:#263241;--text:#f5f7fa;--muted:#9aa8b7;--accent:#78e08f;--gold:#ffd166;--warn:#ff9f43;--bad:#ff6b6b;--blue:#6ca8ff;--shadow:0 16px 44px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 15% 0,#16291f 0,transparent 36%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.55}.wrap{width:min(1120px,100%);margin:auto;padding:0 16px 72px}.hero{padding:34px 0 20px}.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border:1px solid #2e4d3b;background:#102119;border-radius:999px;color:#a8f0ba;font-size:12px}.hero h1{font-size:clamp(30px,7vw,58px);line-height:1.02;margin:14px 0 12px;letter-spacing:-.04em}.hero p{max-width:760px;color:#b4c0cc;margin:0;font-size:15px}.hero strong{color:#fff}.notice{margin-top:18px;padding:12px 14px;border:1px solid #4f3c19;background:#1f1a10;border-radius:14px;color:#e8cf98;font-size:13px}.toolbar{position:sticky;top:0;z-index:20;padding:10px 0;background:linear-gradient(var(--bg) 72%,transparent);backdrop-filter:blur(10px)}.controls{display:grid;grid-template-columns:1fr auto;gap:8px}.search{width:100%;border:1px solid var(--line);background:#101720;color:#fff;border-radius:13px;padding:12px 14px;outline:none}.search:focus{border-color:#52765d}.btn{border:1px solid var(--line);background:#141d27;color:#dfe7ef;border-radius:13px;padding:0 13px;cursor:pointer}.chips{display:flex;gap:8px;overflow:auto;padding:9px 0 3px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#101720;color:#aab7c4;border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer}.chip.on{background:#1b3a27;border-color:#316244;color:#b9f7c8}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:24px 0 10px}.section-head h2{margin:0;font-size:20px}.count{color:var(--muted);font-size:12px}.list{display:grid;gap:10px}.card{background:linear-gradient(145deg,#151d27,#10161e);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.summary{display:grid;grid-template-columns:46px 1fr auto;gap:11px;align-items:center;padding:14px;cursor:pointer}.rank{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#202a36;color:#dfe7ef;font-weight:800}.card[data-rank="1"] .rank{background:#3a3115;color:#ffe28a}.card[data-rank="2"] .rank{background:#28303a;color:#e8eef5}.card[data-rank="3"] .rank{background:#3b291d;color:#ffc68f}.name{font-weight:800;font-size:16px}.pick{font-size:12px;color:#a7b4c1;margin-top:3px}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{font-size:11px;padding:3px 7px;border-radius:999px;background:#1d2834;color:#a9b9c9;border:1px solid #293746}.tag.green{background:#153220;color:#a9efbb;border-color:#27533a}.tag.yellow{background:#352a12;color:#efd88f;border-color:#59451d}.chev{font-size:20px;color:#748495;transition:.2s}.card.open .chev{transform:rotate(180deg)}.detail{display:none;border-top:1px solid var(--line);padding:0 14px 15px}.card.open .detail{display:block}.block{margin-top:14px}.label{font-size:11px;font-weight:800;letter-spacing:.08em;color:#6f8296;text-transform:uppercase;margin-bottom:5px}.block p{margin:0;color:#d9e0e8;font-size:14px}.highlight{padding:12px;border-radius:13px;background:#102319;border:1px solid #284c36}.highlight p{color:#c9f0d3}.warning{padding:11px 12px;border-radius:13px;background:#281d12;border:1px solid #51371d;color:#ebc99e;font-size:13px}.tiers{display:grid;gap:7px}.tier{padding:10px 11px;border:1px solid #253342;background:#111923;border-radius:12px}.tier-top{display:flex;justify-content:space-between;gap:10px}.tier-name{font-weight:700;font-size:13px}.price{color:#96efaa;font-weight:800;font-size:13px}.tier-sub{margin-top:5px;color:#9daaba;font-size:12px}.empty{padding:40px 16px;text-align:center;color:#7f90a2}.footer{margin-top:34px;color:#77889a;font-size:12px;text-align:center}.fav{font-size:19px;line-height:1;color:#68798a;border:0;background:none;padding:5px;cursor:pointer}.fav.on{color:#ffd166}.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.topbar .mini{color:#8394a6;font-size:12px}.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{padding:12px;border-radius:14px;border:1px solid var(--line);background:#101720}.stat b{display:block;font-size:19px}.stat span{color:#8292a3;font-size:11px}
@media (min-width:760px){.wrap{padding-inline:24px}.hero{padding-top:56px}.controls{grid-template-columns:1fr 140px}.list{grid-template-columns:repeat(2,minmax(0,1fr))}.card.open{grid-column:1/-1}.hero-stats{max-width:520px}.summary{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <span class="eyebrow">端游 · 接受跨天 · 实际资产优先</span>
  <h1>三角洲护航<br>性价比排行榜</h1>
  <p>不是简单算“保底 ÷ 单价”。这里把<strong>玩法结单机制、任务硬门槛、失败补偿、赖子、免费局、档位差异</strong>一起考虑。点开每个玩法即可看白话规则和所有记录档位。</p>
  <div class="hero-stats"><div class="stat"><b>36</b><span>服务玩法</span></div><div class="stat"><b>全量</b><span>同玩法档位顺序</span></div><div class="stat"><b>39</b><span>原页面栏目</span></div></div>
  <div class="notice">排名是基于规则和概率判断的购买参考，不是商家承诺或实测收益率。带“低/中偏低”把握的项目，关键条款变化会明显改变排名。</div>
</header>
<div class="toolbar">
  <div class="controls"><input id="q" class="search" placeholder="搜玩法、价位、规则，例如：AW / 小金 / 白嫖"/><button id="favOnly" class="btn">只看收藏</button></div>
  <div class="chips" id="chips"><button class="chip on" data-filter="all">全部</button><button class="chip" data-filter="top10">Top 10</button><button class="chip" data-filter="high">高把握</button><button class="chip" data-filter="under500">首选≤500</button><button class="chip" data-filter="long">跨天潜力</button></div>
</div>
<div class="section-head"><h2>购买优先级</h2><span class="count" id="count"></span></div>
<main id="list" class="list"></main>
<div class="footer">数据版本：2026-09-18 · 玩法规则来源于此前整理的商家页面长图 · W = 万哈夫币</div>
</div>
<script src="./data.js"></script>
<script>
const data=window.ESCORT_DATA||[];
const ranked=data.filter(x=>Number.isFinite(Number(x.rank))).sort((a,b)=>a.rank-b.rank);
const extras=data.filter(x=>!Number.isFinite(Number(x.rank)));
let filter='all',favOnly=false;
const favs=new Set(JSON.parse(localStorage.getItem('escortFavs')||'[]'));
const longNames=new Set(['千万才是开始','战争贩子','狗牌收集计划','淘金大作战','黄金大矿工','小香手','一命通关','三幻神专区','永恒之塔','大红爆仓']);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function priceNum(s){const m=String(s||'').match(/(?:^|[^0-9])(\d{1,5})(?=R|元|／|\/|$)/);return m?+m[1]:999999}
function confidenceClass(c){return /高$|^高/.test(c||'')?'green':/低/.test(c||'')?'yellow':''}
function searchable(x){return [x.name,x.pick,x.tierOrder\|x.prices,x.targets,x.mechanism,x.how,x.caveat,...(x.tiers||[]).flatMap(t=>Object.values(t))].join(' ').toLowerCase()}
function tierHtml(t){return `<div class="tier"><div class="tier-top"><span class="tier-name">${esc(t.tier||'档佝')}</span><span class="price">${esc(t.price||'—')}</span></div><div class="tier-sub">目标：${esc(t.target||'—')} · ${esc(t.mode||'')}</div>${t.finish?`<div class="tier-sub">结单：${esc(t.finish)}</div>`:''}${t.modifier?`<div class="tier-sub">增减/赔付：${esc(t.modifier)}</div>`:''}${t.note?`<div class="tier-sub">备注：${esc(t.note)}</div>`:''}</div>`}
function card(x){const r=Number(x.rank);const key=x.name;return `<article class="card" data-rank="${r}" data-name="${esc(key)}"><div class="summary" role="button" tabindex="0"><div class="rank">${r}</div><div><div class="topbar"><div class="name">${esc(x.name)}</div><button class="fav ${favs.has(key)?'on':''}" aria-label="收藏">★</button></div><div class="pick">首选：${esc(x.pick||'—')}</div><div class="meta"><span class="tag ${confidenceClass(x.confidence)}">${esc(x.confidence||'徐判斷')}</span>${x.tiers?.length?`<span class="tag">${x.tiers.length} 个档位记录</span>`:''}</div></div><div class="chev">⌄</div></div><div class="detail"><div class="block highlight"><div class="label">怎么玩 ·災话版</div><p>${esc(x.how||x.mechanism)}</p></div><div class="block"><div class="label">老什么这样排</div><p>${esc(x.mechanism)}</p></div><div class="block"><div class="label">同玩法档位顺序</div><p>${esc(x.tierOrder||'—')}</p></div><div class="block"><div class="label">页面价格 / 目标</div><p>${esc(x.prices||'—')} · ${esc(x.targets||'—')}</p></div>${x.caveat?`<div class="block warning"><b>关键前提 / 歧义：</b>${esc(x.caveat)}</div>`:''}${x.tiers?.length?`<div class="block"><div class="label">具体档位规则</div><div class="tiers">${x.tiers.map(tierHtml).join('')}</div></div>`:''}</div></article>`}
function render(){const q=document.querySelector('#q').value.trim().toLowerCase();let arr=ranked.filter(x=>!q||searchable(x).includes(q));if(favOnly)arr=arr.filter(x=>favs.has(x.name));if(filter==='top10')arr=arr.filter(x=>x.rank<=10);if(filter==='high')arr=arr.filter(x=>/^高/.test(x.confidence||''));if(filter==='under500')arr=arr.filter(x=>priceNum(x.pick)<=500);if(filter==='long')arr=arr.filter(x=>longNames.has(x.name));document.querySelector('#count').textContent=`显示 ${arr.length} / ${ranked.length}`;document.querySelector('#list').innerHTML=arr.length?arr.map(card).join(''):'<div class="empty">没有匹配结果</div>';bind()}
function bind(){document.querySelectorAll('.card .summary').forEach(el=>{el.onclick=(e)=>{if(e.target.closest('.fav'))return;el.parentElement.classList.toggle('open')};el.onkeydown=e=>{if(e.key==='Enter')el.click()}});document.querySelectorAll('.fav').forEach(b=>b.onclick=e=>{e.stopPropagation();const n=b.closest('.card').dataset.name;favs.has(n)?favs.delete(n):favs.add(n);localStorage.setItem('escortFavs',JSON.stringify([...favs]));b.classList.toggle('on',favs.has(n));if(favOnly)render()})}
document.querySelector('#q').oninput=render;document.querySelector('#favOnly').onclick=()=>{favOnly=!favOnly;document.querySelector('#favOnly').textContent=favOnly?'显示全部':'只看收藏';render()};document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');filter=c.dataset.filter;render()});render();
</script>
</body>
</html>
