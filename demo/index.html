<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Markdown to Image</title>
    <!-- Tailwind CSS with Typography Plugin -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <!-- Marked.js for Markdown Parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Highlight.js for Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <!-- HTML2Canvas for Image Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    },
                    typography: (theme) => ({
                        DEFAULT: {
                            css: {
                                color: theme('colors.gray.800'),
                                pre: {
                                    backgroundColor: '#282c34',
                                    color: '#abb2bf',
                                    padding: '1rem',
                                    borderRadius: '0.5rem',
                                },
                                'code::before': { content: '""' },
                                'code::after': { content: '""' },
                            },
                        },
                    }),
                },
            },
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        code { font-family: 'JetBrains Mono', monospace; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .preview-wrapper {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Modal Transitions */
        .modal-enter { opacity: 0; pointer-events: none; }
        .modal-enter .modal-content { transform: scale(0.95); }
        .modal-active { opacity: 1; pointer-events: auto; }
        .modal-active .modal-content { transform: scale(1); }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col overflow-hidden text-sm md:text-base">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center z-10 shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white w-8 h-8 rounded-lg flex items-center justify-center font-bold">G</div>
            <h1 class="font-semibold text-gray-800 tracking-tight">Gemini MD <span class="text-gray-400 mx-1">/</span> Img Converter</h1>
        </div>
        <div class="flex items-center gap-4">
            <a href="https://github.com" target="_blank" class="text-gray-500 hover:text-gray-800 transition-colors">
                <i class="fa-brands fa-github text-lg"></i>
            </a>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Controls -->
        <aside class="w-80 bg-white border-r border-gray-200 flex flex-col z-20 shadow-sm shrink-0 overflow-y-auto">
            <div class="p-5 border-b border-gray-100">
                <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4">Settings</h2>
                
                <!-- Background Styles -->
                <div class="mb-6">
                    <label class="block text-gray-700 text-xs font-medium mb-2">背景风格</label>
                    <div class="grid grid-cols-4 gap-2" id="bg-selector">
                        <!-- Generated by JS -->
                    </div>
                </div>

                <!-- Width Toggle -->
                <div class="mb-6">
                    <label class="block text-gray-700 text-xs font-medium mb-2">图片宽度</label>
                    <div class="flex bg-gray-100 p-1 rounded-lg">
                        <button onclick="setWidth('mobile')" id="btn-mobile" class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all text-gray-500 hover:text-gray-700">Mobile</button>
                        <button onclick="setWidth('tablet')" id="btn-tablet" class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all bg-white text-gray-800 shadow-sm">Tablet</button>
                        <button onclick="setWidth('desktop')" id="btn-desktop" class="flex-1 py-1.5 text-xs font-medium rounded-md transition-all text-gray-500 hover:text-gray-700">PC</button>
                    </div>
                </div>

                <!-- Toggle Window Controls -->
                <div class="flex items-center justify-between mb-6">
                    <label class="text-gray-700 text-xs font-medium">macOS 窗口栏</label>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-window-controls" class="sr-only peer" checked onchange="toggleWindowControls()">
                        <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
                
                 <!-- Toggle Signature -->
                 <div class="flex items-center justify-between mb-6">
                    <label class="text-gray-700 text-xs font-medium">显示水印</label>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-signature" class="sr-only peer" checked onchange="toggleSignature()">
                        <div class="w-9 h-5 bg-gray-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
            </div>

            <!-- Actions -->
            <div class="p-5 mt-auto bg-gray-50">
                <button onclick="copyImage()" id="btn-copy" class="w-full mb-3 bg-gray-900 hover:bg-gray-800 text-white font-medium py-2.5 px-4 rounded-lg transition-all flex items-center justify-center gap-2 group active:scale-95">
                    <i class="fa-regular fa-copy group-hover:scale-110 transition-transform"></i>
                    <span>复制到剪贴板</span>
                </button>
                <button onclick="downloadImage()" id="btn-download" class="w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-lg transition-all flex items-center justify-center gap-2 active:scale-95">
                    <i class="fa-solid fa-download"></i>
                    <span>下载 PNG</span>
                </button>
            </div>
        </aside>

        <!-- Editor & Preview Area -->
        <main class="flex-1 flex flex-col md:flex-row bg-gray-100 relative">
            
            <!-- Editor Input -->
            <div class="flex-1 border-r border-gray-200 bg-white flex flex-col h-1/2 md:h-full">
                <div class="px-4 py-2 bg-gray-50 border-b border-gray-100 text-xs font-medium text-gray-500 uppercase tracking-wide">Input Markdown</div>
                <textarea id="markdown-input" class="flex-1 w-full p-6 resize-none focus:outline-none font-mono text-sm leading-relaxed text-gray-700" placeholder="在此粘贴 Gemini 的回复..."></textarea>
            </div>

            <!-- Preview Canvas Area -->
            <div class="flex-1 bg-gray-200/50 flex items-center justify-center p-8 overflow-auto h-1/2 md:h-full relative" id="preview-scroll-area">
                
                <!-- The Capture Target -->
                <div id="capture-target" class="preview-wrapper transition-all duration-500 shadow-2xl origin-center mx-auto">
                    <!-- Dynamic Background -->
                    <div id="bg-layer" class="w-full h-full p-8 md:p-12 flex flex-col">
                        
                        <!-- The Card -->
                        <div class="bg-white/95 backdrop-blur-sm rounded-xl shadow-lg overflow-hidden flex flex-col relative border border-white/40">
                            
                            <!-- Window Controls -->
                            <div id="window-controls" class="bg-gray-100/80 border-b border-gray-200/60 px-4 py-3 flex items-center gap-2 shrink-0">
                                <div class="w-3 h-3 rounded-full bg-[#FF5F56] border border-[#E0443E]"></div>
                                <div class="w-3 h-3 rounded-full bg-[#FFBD2E] border border-[#DEA123]"></div>
                                <div class="w-3 h-3 rounded-full bg-[#27C93F] border border-[#1AAB29]"></div>
                            </div>

                            <!-- Content -->
                            <div class="p-8 md:p-10 min-h-[200px]">
                                <article id="markdown-render" class="prose prose-slate max-w-none prose-pre:my-4 prose-p:my-3 prose-headings:font-bold prose-h1:text-2xl prose-h2:text-xl prose-code:text-blue-600 prose-code:bg-blue-50 prose-code:px-1 prose-code:py-0.5 prose-code:rounded prose-code:before:content-none prose-code:after:content-none text-gray-700">
                                    <!-- Rendered Content Goes Here -->
                                </article>
                            </div>

                            <!-- Signature Footer -->
                            <div id="signature-footer" class="border-t border-gray-100 px-8 py-3 flex justify-between items-center text-xs text-gray-400 font-mono">
                                <span>Generated by Gemini</span>
                                <span>AI Insight</span>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Fallback Modal (For when Clipboard API fails) -->
    <div id="fallback-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm transition-all duration-300 modal-enter">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col modal-content transition-all duration-300">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50 rounded-t-xl">
                <div>
                    <h3 class="font-semibold text-gray-800">图片生成成功</h3>
                    <p class="text-xs text-gray-500 mt-0.5">由于浏览器安全限制，无法自动写入剪贴板</p>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 hover:bg-gray-200 w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <!-- Modal Body (Image Preview) -->
            <div class="flex-1 overflow-auto p-8 bg-gray-100 flex items-center justify-center min-h-0">
                <img id="modal-img" src="" alt="Generated Image" class="shadow-lg rounded-lg max-w-full h-auto border border-gray-300 select-none">
            </div>

            <!-- Modal Footer -->
            <div class="px-6 py-4 border-t border-gray-100 bg-white rounded-b-xl flex justify-between items-center">
                <div class="text-sm text-amber-600 font-medium flex items-center gap-2">
                    <i class="fa-regular fa-hand-point-up"></i>
                    <span>请在图片上 <b class="underline">右键 -> 复制图片</b></span>
                </div>
                <div class="flex gap-3">
                    <button onclick="downloadFromModal()" class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors text-sm">
                        <i class="fa-solid fa-download mr-2"></i>下载文件
                    </button>
                    <button onclick="closeModal()" class="px-5 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg font-medium transition-colors text-sm shadow-sm shadow-blue-200">
                        完成
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-4 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-3">
        <i class="fa-solid fa-circle-check text-green-400"></i>
        <span id="toast-msg">Operation successful</span>
    </div>

    <script>
        // --- 1. State & Config ---
        const gradients = [
            { name: 'Obsidian', class: 'bg-gradient-to-br from-gray-900 to-gray-800' },
            { name: 'Sunset', class: 'bg-gradient-to-br from-orange-400 to-rose-400' },
            { name: 'Ocean', class: 'bg-gradient-to-br from-blue-400 to-emerald-400' },
            { name: 'Midnight', class: 'bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900' },
            { name: 'Clean', class: 'bg-gray-100' },
            { name: 'White', class: 'bg-white border border-gray-200' },
            { name: 'Pink', class: 'bg-gradient-to-br from-pink-300 via-purple-300 to-indigo-400' },
            { name: 'Lemon', class: 'bg-gradient-to-br from-yellow-100 to-orange-100' }
        ];

        const widthPresets = {
            mobile: '375px',
            tablet: '580px',
            desktop: '720px'
        };

        const defaultMD = `## 📊 投资策略分析

基于当前市场数据，我们观察到以下趋势：

1. **宏观流动性**：保持宽松，有利于权益类资产。
2. **房地产**：一线城市核心地段保值属性依然稳健。

### 代码示例 (React)

\`\`\`tsx
const InvestmentCard = ({ roi, risk }) => {
  return (
    <div className="card">
      <h3>ROI: {roi}%</h3>
      <span className="badge">{risk}</span>
    </div>
  );
};
\`\`\`

> "长期主义是穿越周期的唯一法宝。"`;

        // --- 2. Initialization ---
        const inputEl = document.getElementById('markdown-input');
        const outputEl = document.getElementById('markdown-render');
        const bgLayer = document.getElementById('bg-layer');
        const captureTarget = document.getElementById('capture-target');
        
        // Modal State
        let currentBlob = null;
        let currentBlobUrl = null;

        // Configure Marked
        marked.setOptions({
            highlight: function(code, lang) {
                const language = highlight.getLanguage(lang) ? lang : 'plaintext';
                return highlight.highlight(code, { language }).value;
            },
            langPrefix: 'hljs language-',
            breaks: true,
            gfm: true
        });

        // Initialize
        window.onload = () => {
            renderBGSelectors();
            inputEl.value = defaultMD;
            updatePreview();
            setBg(3); // Default to Midnight
            setWidth('tablet');
        };

        // --- 3. Core Logic ---

        // Real-time Rendering
        inputEl.addEventListener('input', debounce(updatePreview, 300));

        function updatePreview() {
            const rawMD = inputEl.value;
            outputEl.innerHTML = marked.parse(rawMD);
        }

        // Theme Handling
        function renderBGSelectors() {
            const container = document.getElementById('bg-selector');
            gradients.forEach((g, idx) => {
                const btn = document.createElement('button');
                btn.className = `${g.class} w-full h-8 rounded-md border border-black/10 hover:scale-105 transition-transform focus:outline-none focus:ring-2 focus:ring-offset-1 focus:ring-blue-500`;
                btn.onclick = () => setBg(idx);
                container.appendChild(btn);
            });
        }

        function setBg(index) {
            bgLayer.className = `w-full h-full p-8 md:p-12 flex flex-col transition-colors duration-500 ${gradients[index].class}`;
        }

        // Layout Handling
        function setWidth(mode) {
            captureTarget.style.width = widthPresets[mode];
            
            // Update buttons styling
            ['mobile', 'tablet', 'desktop'].forEach(m => {
                const btn = document.getElementById(`btn-${m}`);
                if(m === mode) {
                    btn.className = "flex-1 py-1.5 text-xs font-medium rounded-md transition-all bg-white text-gray-800 shadow-sm";
                } else {
                    btn.className = "flex-1 py-1.5 text-xs font-medium rounded-md transition-all text-gray-500 hover:text-gray-700";
                }
            });
        }

        function toggleWindowControls() {
            const el = document.getElementById('window-controls');
            const chk = document.getElementById('toggle-window-controls');
            el.style.display = chk.checked ? 'flex' : 'none';
        }

        function toggleSignature() {
            const el = document.getElementById('signature-footer');
            const chk = document.getElementById('toggle-signature');
            el.style.display = chk.checked ? 'flex' : 'none';
        }

        // Image Generation
        async function generateImageBlob() {
            const originalTransform = captureTarget.style.transform;
            captureTarget.style.transform = 'none'; // Reset scale for capture
            
            // Wait for images/fonts to settle
            await new Promise(r => setTimeout(r, 100));

            try {
                const canvas = await html2canvas(captureTarget, {
                    scale: 3, // High resolution
                    useCORS: true,
                    backgroundColor: null,
                    logging: false, // Turn off logging to reduce console noise
                    onclone: (clonedDoc) => {
                        const clonedTarget = clonedDoc.getElementById('capture-target');
                        clonedTarget.style.transform = 'none'; 
                    }
                });
                
                captureTarget.style.transform = originalTransform; // Restore view
                return canvas;
            } catch (err) {
                console.error("html2canvas error:", err);
                showToast('生成图片渲染失败', 'error');
                return null;
            }
        }

        async function copyImage() {
            const btn = document.getElementById('btn-copy');
            const icon = btn.querySelector('i');
            const originalIcon = icon.className;
            
            // Loading state
            icon.className = 'fa-solid fa-spinner fa-spin';
            btn.disabled = true;

            const canvas = await generateImageBlob();
            
            if (canvas) {
                canvas.toBlob(async (blob) => {
                    try {
                        // 1. Try modern Clipboard API
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        showToast('已复制到剪贴板！');
                    } catch (err) {
                        // 2. Fallback: Permission Denied or Not Supported
                        console.warn("Clipboard write failed (likely permission policy):", err);
                        
                        // Show Modal for manual copy
                        openModal(blob);
                        showToast('请在弹窗中右键复制', 'warning');

                    } finally {
                        icon.className = originalIcon;
                        btn.disabled = false;
                    }
                });
            } else {
                icon.className = originalIcon;
                btn.disabled = false;
            }
        }

        async function downloadImage() {
            const btn = document.getElementById('btn-download');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>处理中...</span>';
            btn.disabled = true;

            const canvas = await generateImageBlob();
            
            if (canvas) {
                const link = document.createElement('a');
                link.download = `gemini-share-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                showToast('下载已开始');
            }
            
            btn.innerHTML = originalText;
            btn.disabled = false;
        }

        // --- Modal Logic ---
        function openModal(blob) {
            currentBlob = blob;
            if(currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
            currentBlobUrl = URL.createObjectURL(blob);

            const modal = document.getElementById('fallback-modal');
            const img = document.getElementById('modal-img');
            
            img.src = currentBlobUrl;
            modal.classList.remove('modal-enter');
            modal.classList.add('modal-active');
        }

        function closeModal() {
            const modal = document.getElementById('fallback-modal');
            modal.classList.remove('modal-active');
            modal.classList.add('modal-enter');
        }

        function downloadFromModal() {
             if (currentBlobUrl) {
                const link = document.createElement('a');
                link.download = `gemini-share-manual-${Date.now()}.png`;
                link.href = currentBlobUrl;
                link.click();
                showToast('下载已开始');
            }
        }

        // Close modal on click outside
        document.getElementById('fallback-modal').addEventListener('click', (e) => {
            if(e.target.id === 'fallback-modal') closeModal();
        });

        // Utilities
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-msg');
            const icon = toast.querySelector('i');
            
            msgEl.innerText = msg;
            if(type === 'error') {
                icon.className = 'fa-solid fa-circle-exclamation text-red-400';
            } else if (type === 'warning') {
                icon.className = 'fa-solid fa-triangle-exclamation text-amber-400';
            } else {
                icon.className = 'fa-solid fa-circle-check text-green-400';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 4000);
        }

    </script>
</body>
</html>
